<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busbar Sizing</title>
    <meta name="description" content="Work out how thick a busbar needs to be for a given current and temperature rise." />

    <!-- PWA: Busbar Sizing's own app identity (separate from the OmniPorta hub) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Busbar Sizing" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('omniporta-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
    <script type="module" crossorigin src="../assets/busbar-UabNckha.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/rolldown-runtime-CbXtAM7H.js">
    <link rel="modulepreload" crossorigin href="../assets/theme-DkM-Mmqt.js">
    <link rel="stylesheet" crossorigin href="../assets/theme-D5GNyYRp.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
